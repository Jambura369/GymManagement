<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="redgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A57"/>
      <stop offset="100%" stop-color="#C62E2D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="200" rx="18" fill="#161616"/>

  <polygon points="135,27 187,58 187,118 135,149 83,118 83,58" fill="url(#redgrad)" filter="url(#glow)"/>
  <polygon points="135,38 176,62 176,114 135,138 94,114 94,62" fill="#161616" opacity="0.18"/>

  <text x="135" y="88" font-size="86" font-weight="900" fill="#FFFFFF"
    font-family="'Arial Black', Arial, sans-serif" text-anchor="middle" dominant-baseline="central">G</text>

  <text x="226" y="88" font-size="68" font-weight="900" font-family="'Arial Black', Arial, sans-serif" dominant-baseline="central">
    <tspan fill="#FFFFFF">GYM</tspan><tspan fill="url(#redgrad)">BLIX</tspan>
  </text>
  <rect x="226" y="128" width="296" height="4" rx="1.5" fill="url(#redgrad)" filter="url(#glow)"/>
  <text x="228" y="157" font-size="12" font-weight="400" letter-spacing="5.5" fill="#E0807E" opacity="0.85"
    font-family="Arial, sans-serif">FITNESS MANAGEMENT</text>
</svg>
