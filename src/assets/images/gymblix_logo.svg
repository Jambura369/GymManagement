<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0C1A"/>
      <stop offset="100%" stop-color="#1C1B30"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="160" rx="16" fill="url(#bg)"/>

  <!-- Hex outer border -->
  <polygon points="75,26 121.8,53 121.8,107 75,134 28.2,107 28.2,53"
    fill="none" stroke="url(#brand)" stroke-width="3" filter="url(#glow)"/>
  <!-- Hex inner border (double line effect) -->
  <polygon points="75,36 113.1,58 113.1,102 75,124 36.9,102 36.9,58"
    fill="#7C3AED" opacity="0.12"/>
  <polygon points="75,36 113.1,58 113.1,102 75,124 36.9,102 36.9,58"
    fill="none" stroke="url(#brand)" stroke-width="1.5" opacity="0.5"/>

  <!-- Gear icon (sits behind G, visible through G's opening) -->
  <!-- outer_r=14, inner_r=10.5, 8 teeth, center (93, 78) -->
  <path d="M 103.37,76.36 L 106.90,76.29 L 106.90,79.71 L 103.37,79.64
           L 101.50,84.17 L 104.03,86.62 L 101.62,89.03 L 99.17,86.50
           L 94.64,88.37 L 94.71,91.90 L 91.29,91.90 L 91.36,88.37
           L 86.83,86.50 L 84.38,89.03 L 81.97,86.62 L 84.50,84.17
           L 82.63,79.64 L 79.10,79.71 L 79.10,76.29 L 82.63,76.36
           L 84.50,71.83 L 81.97,69.38 L 84.38,66.97 L 86.83,69.50
           L 91.36,67.63 L 91.29,64.10 L 94.71,64.10 L 94.64,67.63
           L 99.17,69.50 L 101.62,66.97 L 104.03,69.38 L 101.50,71.83 Z"
    fill="url(#brand)" filter="url(#glow)"/>
  <!-- Gear center hole -->
  <circle cx="93" cy="78" r="5" fill="#0D0C1A"/>

  <!-- Large G monogram (overlaid on gear — gear shows through G's opening) -->
  <text x="75" y="104"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="76" font-weight="900" text-anchor="middle"
    fill="#F1F0FF">G</text>

  <!-- GYMBLIX brand name -->
  <text x="152" y="106"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="60" font-weight="900" letter-spacing="-1"
    fill="#F1F0FF">GYMBLIX</text>

  <!-- Brand gradient underline -->
  <rect x="152" y="116" width="373" height="3.5" rx="1.5" fill="url(#brand)" filter="url(#glow)"/>

  <!-- Tagline (light weight — subordinate to brand name) -->
  <text x="154" y="141"
    font-family="Arial, sans-serif"
    font-size="11" font-weight="400" letter-spacing="5.5"
    fill="#A78BFA" opacity="0.8">FITNESS MANAGEMENT</text>
</svg>
